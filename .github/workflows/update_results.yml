name: Update Dashboard Results

on:
  schedule:
    # Runs every day at 06:00 UTC (after US market open data is available)
    - cron: '0 6 * * 1-5'
  workflow_dispatch:  # allow manual trigger from GitHub UI

permissions:
  contents: write

jobs:
  run-models:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Restore cached state
        run: |
          git fetch origin main
          git checkout origin/main -- Demo_Models/ 2>/dev/null || echo "No cached models yet — training fresh"
          git checkout origin/main -- web/data/predictions_log.json 2>/dev/null || echo "No prediction log yet — starting fresh"

      - name: Run demo pipeline
        env:
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          PORTFOLIO_SIZE: 100000
        run: |
          python demo.py \
            --symbols AAPL MSFT GOOGL AMZN META NVDA AMD AVGO MU TSLA NFLX PLTR CRM CRWD JPM GS COIN LLY BA UBER GLW NBIS SPMO \
            --epochs 30 \
            --steps 8000

      - name: Commit updated results
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add web/data/results.json web/data/predictions_log.json demo_results.xlsx
          git add Demo_Models/ 2>/dev/null || true
          git diff --cached --quiet || git commit -m "chore: update dashboard results [skip ci]"
          git pull --rebase origin main
          git push origin main
