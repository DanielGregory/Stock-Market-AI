name: Aggressive Profile — Sandbox Test

on:
  schedule:
    # Runs every Sunday at 04:00 UTC (after main retrain finishes at 02:00)
    - cron: '0 4 * * 0'
  workflow_dispatch:  # allow manual trigger from GitHub UI

permissions:
  contents: write

jobs:
  aggressive-test:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run aggressive profile (full retrain)
        env:
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          PORTFOLIO_SIZE: 100000
        run: |
          python demo.py \
            --profile aggressive \
            --mode train \
            --symbols \
              NVDA AMD MSFT META GOOGL AMZN AAPL \
              CRWD PLTR COIN MSTR NBIS \
              TQQQ SOXL MARA RKLB IONQ UPST SMCI \
              HOOD SOFI AFRM RIOT CLSK \
              DDOG NET SNOW \
              TSLA NFLX CRM \
              SPMO \
            --epochs 30 \
            --steps 12000

      - name: Commit aggressive results and models
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add web/data/results_aggressive.json 2>/dev/null || true
          git add Aggressive_Models/ 2>/dev/null || true
          git diff --cached --quiet || git commit -m "chore: update aggressive sandbox results [skip ci]"
          git pull --rebase --autostash origin main
          git push origin main
